<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 개발사업 인허가 절차 검색 | 2026년 기준</title>
<style>@font-face { font-family:"KoPubDotum"; src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/KoPubDotumMedium.woff") format("woff"); font-weight:normal; font-display:swap; }</style>
<style>
  :root { --bg:#f3f6fa; --card:#fff; --ink:#1b2a41; --sub:#5b6b80; --line:#dfe5ee; --accent:#2563eb; --chip:#eef3fd; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"KoPubDotum","Malgun Gothic",system-ui,sans-serif; line-height:1.6; }
  .wrap { max-width:880px; margin:0 auto; padding:56px 16px 80px; }
  .eyebrow { color:var(--accent); font-size:14px; font-weight:600; }
  h1 { font-size:34px; margin:8px 0 8px; }
  .lead { color:var(--sub); margin:0 0 24px; }
  .home { text-align:center; padding-top:8vh; }
  .home h1 { font-size:30px; }
  .search { width:100%; padding:16px 18px; font-size:17px; border:1px solid var(--line); border-radius:14px; background:#fff; }
  .search:focus { outline:2px solid var(--accent); border-color:transparent; }
  .picks { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:18px; }
  .pick { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:8px 16px; font-size:15px; cursor:pointer; font-family:inherit; }
  .pick:hover { border-color:var(--accent); color:var(--accent); }
  .pick small { color:var(--sub); margin-left:6px; font-size:12px; }
  .msg { color:var(--sub); font-size:14px; margin-top:16px; }
  .back { display:inline-block; margin-bottom:20px; color:var(--accent); text-decoration:none; font-size:14px; cursor:pointer; background:none; border:none; padding:0; font-family:inherit; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px; }
  .card h2 { margin:0 0 4px; font-size:26px; }
  .tag { display:inline-block; font-size:12px; background:var(--chip); color:var(--accent); padding:2px 8px; border-radius:6px; margin-bottom:8px; }
  .summary { color:var(--sub); margin:4px 0 14px; }
  .jeju { font-size:13px; background:#fff8e6; border:1px solid #f3e2b3; border-radius:8px; padding:8px 12px; margin-bottom:20px; }
  ol.steps { list-style:none; padding:0; margin:0; counter-reset:s; }
  ol.steps li { position:relative; padding:0 0 20px 44px; counter-increment:s; }
  ol.steps li::before { content:counter(s); position:absolute; left:0; top:0; width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff; font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  ol.steps li:not(:last-child)::after { content:""; position:absolute; left:13px; top:30px; bottom:2px; width:2px; background:var(--line); }
  .st { font-weight:700; }
  .sd { color:var(--sub); font-size:14px; }
  .law { display:inline-block; font-size:12px; border:1px solid var(--line); border-radius:6px; padding:1px 7px; margin:4px 4px 0 0; }
  .notes { font-size:13px; color:var(--sub); border-top:1px dashed var(--line); padding-top:10px; margin-top:4px; }
  .foot { color:var(--sub); font-size:12px; margin-top:28px; text-align:center; }
  .wrap.wide { max-width:1180px; }
  .meta { display:flex; flex-wrap:wrap; gap:8px 20px; font-size:13px; color:var(--sub); margin:0 0 12px; }
  .meta b { color:var(--ink); }
  .check { border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:16px; font-size:14px; }
  .check .st { font-size:14px; }
  .tbl-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:12px; }
  table.sch { border-collapse:collapse; width:100%; min-width:860px; font-size:13px; table-layout:fixed; }
  .sch thead th:nth-child(1) { width:40px; } .sch thead th:nth-child(2) { width:100px; }
  .sch th, .sch td { border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:8px 10px; vertical-align:top; text-align:left; }
  .sch th:last-child, .sch td:last-child { border-right:none; }
  .sch thead th { background:#f7f9fc; font-weight:700; position:sticky; top:0; }
  .sch .ph { background:#f7f9fc; font-weight:700; writing-mode:vertical-rl; text-align:center; width:34px; letter-spacing:2px; }
  .sch .t { white-space:nowrap; font-weight:600; width:92px; }
  .sch td.on { background:var(--chip); color:var(--ink); }
  .sch td.on.dup { background:#eef3fd; } .sch td.on.dev { background:#ecf8f0; }
  .sch td.on.env { background:#fff6e5; } .sch td.on.etc { background:#f4effd; }
  .tlaws { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; margin:16px 0; }
  .tlaws > div { border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13px; }
  .q { font-weight:700; font-size:17px; margin:8px 0 10px; }
  .vpicks { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .vpick { border:1px solid var(--line); border-radius:12px; padding:8px 14px; text-decoration:none; color:var(--ink); background:#fff; display:flex; flex-direction:column; font-size:15px; }
  .vpick small { color:var(--sub); font-size:12px; }
  .vpick:hover, .vpick.sel { border-color:var(--accent); color:var(--accent); background:var(--chip); }
  .vhead { border-top:1px solid var(--line); padding-top:14px; margin-bottom:14px; }
  .tip { font-size:13px; background:#eef6ff; border:1px solid #cfe0fb; border-radius:8px; padding:8px 12px; margin-bottom:16px; }
  .toggles { display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; font-size:14px; margin-bottom:12px; }
  .toggles b { margin-right:4px; }
  .toggles label { cursor:pointer; }
  .sch .orig { font-size:11px; font-weight:400; color:var(--sub); }
  .calc { font-size:12px; color:#b45309; margin-left:6px; }
  .sch td.on.dis { background:#fdecec; } .sch td.on.land { background:#f4effd; } .sch td.on.trf { background:#eaf7f7; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .topbar .back { margin-bottom:0; }
  .pdf { border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:10px; padding:8px 16px; font-size:14px; cursor:pointer; font-family:inherit; }
  .pdf:hover { opacity:.9; }
  .printsel { display:none; }
  .printbar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:18px 0 6px; padding:14px 16px; border:1px solid #cfe0fb; background:#f5f9ff; border-radius:12px; }
  .printbar span { font-size:14px; color:var(--sub); }
  .printbar .pdf { font-size:15px; padding:10px 20px; }
  @page { size:A4 landscape; margin:10mm; }
  @media print { body { -webkit-print-color-adjust:exact; print-color-adjust:exact; } }
  body.printing { background:#fff; }
  body.printing .wrap, body.printing .wrap.wide { max-width:none; padding:0; margin:0; }
  body.printing .topbar, body.printing .printbar, body.printing .vpicks, body.printing .q, body.printing .toggles label { display:none !important; }
  body.printing .printsel { display:inline; }
  body.printing .card { border:none; padding:0; border-radius:0; }
  body.printing .tbl-wrap { overflow:visible; }
  body.printing table.sch { min-width:0; }
  body.printing .sch thead th { position:static; }
  body.printing .foot { margin:8px 0 0; text-align:left; }
  @media (max-width:600px){ h1{font-size:24px;} .card{padding:20px;} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<p class="foot">기준일 <span id="updated"></span> · 근거 조문은 국가법령정보센터에서 최신 개정 여부를 확인하세요.</p>

<script src="data.js"></script>
<script>
  const app = document.getElementById("app");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  if (typeof PERMITS === "undefined") {
    app.innerHTML = '<div class="card">data.js를 불러오지 못했습니다. 저장소에 data.js가 index.html과 같은 위치에 있는지 확인하세요.</div>';
  } else {
    document.getElementById("updated").textContent = UPDATED;

    const find = q => {
      const k = q.trim().toLowerCase().replace(/\s/g, "");
      if (!k) return [];
      const norm = s => s.toLowerCase().replace(/\s/g, "");
      return PERMITS.filter(p => [p.name, ...(p.keywords||[])].some(w => norm(w).includes(k) || k.includes(norm(w))));
    };

    const home = (q = "", msg = "") => {
      app.classList.remove("wide");
      app.innerHTML = `
        <div class="home">
          <div class="eyebrow">도시계획 실무지원</div>
          <h1>어떤 사업을 검토하시나요?</h1>
          <p class="lead">사업유형을 입력하거나 아래에서 선택하세요.</p>
          <input id="q" class="search" type="search" placeholder="예: 관광농원, 지구단위계획, 관광휴양형" autocomplete="off" value="${esc(q)}">
          <div class="msg" id="msg">${msg}</div>
          <div class="picks" id="picks"></div>
        </div>`;
      const $q = document.getElementById("q");
      const $picks = document.getElementById("picks");
      const $msg = document.getElementById("msg");
      const drawPicks = list => {
        $picks.innerHTML = list.map(p => `<button class="pick" data-id="${p.id}">${esc(p.name)}<small>${esc(p.category)}</small></button>`).join("");
      };
      drawPicks(PERMITS);
      $q.addEventListener("input", () => {
        const hits = find($q.value);
        if (!$q.value.trim()) { $msg.textContent = ""; drawPicks(PERMITS); return; }
        $msg.textContent = hits.length ? `${hits.length}개 사업유형이 있습니다. Enter를 누르거나 선택하세요.` : "해당 사업유형이 아직 등록되지 않았습니다.";
        drawPicks(hits.length ? hits : []);
      });
      $q.addEventListener("keydown", e => {
        if (e.key !== "Enter") return;
        const hits = find($q.value);
        if (hits.length) location.hash = hits[0].id;
      });
      $picks.addEventListener("click", e => {
        const b = e.target.closest(".pick");
        if (b) location.hash = b.dataset.id;
      });
      $q.focus();
    };

    const lawTags = laws => (laws||[]).map(l => `<span class="law">${esc(l)}</span>`).join("");

    const parseT = t => {
      if (/^D$/.test(t.trim())) return { a: 0, b: 0 };
      const m = t.match(/D\s*\+\s*(\d+)(?:\s*~\s*(\d+))?/);
      return m ? { a: +m[1], b: +(m[2] || m[1]) } : null;
    };
    const fmtT = (a, b) => a === 0 && b === 0 ? "D" : (a === b ? `D+${a}개월` : `D+${a}~${b}개월`);

    const scheduleView = (s, on) => {
      const tracks = s.tracks.filter(t => on[t.id] !== false);
      const shown = r => tracks.some(t => r.c[t.id]);
      const flat = s.phases.flatMap(ph => ph.rows);
      const pos = flat.map(r => parseT(r.t));
      const dur = flat.map((r, i) => {
        if (!pos[i]) return 0;
        for (let k = i + 1; k < flat.length; k++) if (pos[k]) return pos[k].a - pos[i].a;
        return 0;
      });
      let shift = 0, lastEnd = 0;
      const label = new Map();
      flat.forEach((r, i) => {
        if (!shown(r)) { shift += dur[i]; return; }
        if (!pos[i]) { label.set(r, { t: r.t }); return; }
        const a = pos[i].a - shift, b = pos[i].b - shift;
        lastEnd = Math.max(lastEnd, b);
        label.set(r, { t: fmtT(a, b), orig: shift ? r.t : "" });
      });
      const head = `<tr><th>단계</th><th>개략 기간</th>${tracks.map(t => `<th>${esc(t.name)}</th>`).join("")}</tr>`;
      const body = s.phases.map(ph => {
        const rows = ph.rows.filter(shown);
        return rows.map((r, i) => {
          const L = label.get(r);
          return `
        <tr>
          ${i === 0 ? `<td class="ph" rowspan="${rows.length}">${esc(ph.name)}</td>` : ""}
          <td class="t">${esc(L.t)}${L.orig ? `<div class="orig">원래 ${esc(L.orig)}</div>` : ""}</td>
          ${tracks.map(t => r.c[t.id] ? `<td class="on ${t.id}">${esc(r.c[t.id])}</td>` : "<td></td>").join("")}
        </tr>`;
        }).join("");
      }).join("");
      const opts = s.tracks.filter(t => t.optional);
      const total = shift > 0
        ? `약 ${lastEnd}개월 <span class="calc">제외한 절차 기간을 빼고 자동 계산 · 원래 ${esc(s.total || "")}</span>`
        : esc(s.total || "");
      return `
        ${opts.length ? `<div class="toggles"><b>해당 영향평가</b><span class="printsel">${esc(opts.filter(t => on[t.id] !== false).map(t => t.name).join(", ") || "해당 없음")}</span>${opts.map(t => `<label><input type="checkbox" data-t="${t.id}" ${on[t.id] !== false ? "checked" : ""}> ${esc(t.name)}</label>`).join("")}</div>` : ""}
        <div class="meta"><span><b>기준</b> ${esc(s.base)}</span>${s.total ? `<span><b>총 소요</b> ${total}</span>` : ""}</div>
        <div class="tbl-wrap"><table class="sch"><thead>${head}</thead><tbody>${body}</tbody></table></div>
        <div class="tlaws">${tracks.map(t => `<div><div class="st">${esc(t.name)} 근거</div>${lawTags(t.laws)}</div>`).join("")}</div>`;
    };

    const stepsView = steps => `
      <ol class="steps">
        ${(steps||[]).map(s => `
          <li>
            <div class="st">${esc(s.title)}</div>
            ${s.desc ? `<div class="sd">${esc(s.desc)}</div>` : ""}
            ${lawTags(s.laws)}
          </li>`).join("")}
      </ol>`;

    const mountBody = (el, x) => {
      const on = {};
      if (x.schedule) x.schedule.tracks.forEach(t => { if (t.off) on[t.id] = false; });
      const draw = () => {
        el.innerHTML = `${x.tip ? `<div class="tip">${esc(x.tip)}</div>` : ""}${x.schedule ? scheduleView(x.schedule, on) : ""}${stepsView(x.steps)}
          <div class="printbar"><span>선택한 절차와 영향평가 기준으로 A4 가로 한 장에 출력합니다.</span><button class="pdf" data-print>선택한 절차 PDF로 출력</button></div>`;
        el.querySelectorAll("input[data-t]").forEach(cb => cb.onchange = () => { on[cb.dataset.t] = cb.checked; draw(); });
      };
      draw();
    };

    const detail = (p, vid) => {
      const v = p.variants ? p.variants.find(x => x.id === vid) : null;
      const wide = !!(p.schedule || (v && v.schedule));
      app.classList.toggle("wide", wide);
      app.innerHTML = `
        <div class="topbar">
          <button class="back" id="back">← 다른 사업 검토하기</button>
          <button class="pdf" id="pdf" title="인쇄 창에서 대상을 'PDF로 저장'으로 선택하세요">PDF로 출력</button>
        </div>
        <article class="card">
          <span class="tag">${esc(p.category)}</span>
          <h2>${esc(p.name)}</h2>
          <p class="summary">${esc(p.summary)}</p>
          ${p.jejuNote ? `<div class="jeju">제주 특례 · ${esc(p.jejuNote)}</div>` : ""}
          ${(p.checks||[]).map(c => `<div class="check"><div class="st">사전 확인 · ${esc(c.title)}</div><div class="sd">${esc(c.desc)}</div>${lawTags(c.laws)}</div>`).join("")}
          ${p.variants ? `
            <div class="q">${esc(p.question || "어떤 경우인가요?")}</div>
            <div class="vpicks">${p.variants.map(x => `<a class="vpick ${v && v.id === x.id ? "sel" : ""}" href="#${p.id}/${x.id}">${esc(x.label)}<small>${esc(x.tier)}</small></a>`).join("")}</div>
            ${v ? `<div class="vhead"><span class="tag">${esc(v.tier)}</span> <b>${esc(v.label)}</b><div class="sd">${esc(v.summary || "")}</div></div>` : ""}` : ""}
          <div id="body"></div>
          ${(p.notes||[]).length ? `<div class="notes">${p.notes.map(esc).join("<br>")}</div>` : ""}
        </article>`;
      if (v) mountBody(document.getElementById("body"), v);
      else if (!p.variants) mountBody(document.getElementById("body"), p);
      document.getElementById("back").onclick = () => { location.hash = ""; };
      const doPrint = () => {
        const old = document.title;
        document.title = `${p.name}${v ? "_" + v.label : ""}_인허가절차`.replace(/[\\/:*?"<>|]/g, "");
        window.print();
        document.title = old;
      };
      document.getElementById("pdf").onclick = doPrint;
      app.onclick = e => { if (e.target.closest("[data-print]")) doPrint(); };
      if (!vid) window.scrollTo(0, 0);
    };

    const PAGE_W = 277 * 96 / 25.4, PAGE_H = 190 * 96 / 25.4 * 0.93;
    const fitPage = () => {
      const b = document.body;
      b.classList.add("printing");
      b.style.zoom = 1;
      const fits = z => {
        b.style.width = (PAGE_W / z) + "px";
        return document.documentElement.scrollHeight * z <= PAGE_H;
      };
      let z = 1;
      if (!fits(1)) {
        let lo = 0.15, hi = 1;
        for (let i = 0; i < 14; i++) { const m = (lo + hi) / 2; if (fits(m)) lo = m; else hi = m; }
        z = lo;
        fits(z);
      }
      b.style.zoom = z;
    };
    const unfit = () => {
      const b = document.body;
      b.classList.remove("printing");
      b.style.zoom = ""; b.style.width = "";
    };
    window.addEventListener("beforeprint", fitPage);
    window.addEventListener("afterprint", unfit);

    const route = () => {
      const [id, vid] = decodeURIComponent(location.hash.slice(1)).split("/");
      const p = PERMITS.find(x => x.id === id);
      if (p) return detail(p, vid);
      const q = new URLSearchParams(location.search).get("q") || "";
      if (q) { const hits = find(q); if (hits.length === 1) { location.hash = hits[0].id; return; } }
      home(q);
      if (q) document.getElementById("q").dispatchEvent(new Event("input"));
    };
    window.addEventListener("hashchange", route);
    route();
  }
</script>
</body>
</html>
