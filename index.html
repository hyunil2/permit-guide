<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>인허가 절차 안내</title>
  <style>
    body {
      margin: 0;
      padding: 60px 24px;
      background: #f3f6fa;
      color: #172b4d;
      font-family: system-ui, sans-serif;
    }
    main {
      max-width: 800px;
      margin: auto;
    }
    h1 { font-size: 36px; }
    p { line-height: 1.8; }
    .card {
      margin-top: 32px;
      padding: 28px;
      background: white;
      border: 1px solid #dce3ed;
      border-radius: 16px;
    }
    .badge {
      color: #2563eb;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <p class="badge">도시계획 실무지원</p>
    <h1>사업유형별 인허가 절차 안내</h1>
    <p>사업별 인허가 절차와 제출서류, 관련 법령을 확인하는 공간입니다.</p>

    <div class="card">
      <h2>농어촌관광휴양단지</h2>
      <p>인허가 절차 안내를 준비 중입니다.</p>
      <p>추후 단계별 절차도, 담당기관, 제출서류와
         근거법령을 확인할 수 있도록 구성할 예정입니다.</p>
    </div>
  </main>
</body>
</html>
