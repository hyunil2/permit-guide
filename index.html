<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 개발사업 인허가 절차 검색 | 2026년 기준</title>
<style>
  :root { --bg:#f3f6fa; --card:#fff; --ink:#1b2a41; --sub:#5b6b80; --line:#dfe5ee; --accent:#2563eb; --chip:#eef3fd; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif; line-height:1.6; }
  .wrap { max-width:880px; margin:0 auto; padding:56px 16px 80px; }
  .eyebrow { color:var(--accent); font-size:14px; font-weight:600; }
  h1 { font-size:34px; margin:8px 0 8px; }
  .lead { color:var(--sub); margin:0 0 24px; }
  .search { width:100%; padding:14px 16px; font-size:16px; border:1px solid var(--line); border-radius:12px; background:#fff; }
  .search:focus { outline:2px solid var(--accent); border-color:transparent; }
  .count { color:var(--sub); font-size:13px; margin:10px 2px 18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px 28px; margin-bottom:16px; }
  .card h2 { margin:0 0 4px; font-size:22px; }
  .tag { display:inline-block; font-size:12px; background:var(--chip); color:var(--accent); padding:2px 8px; border-radius:6px; margin-bottom:8px; }
  .summary { color:var(--sub); margin:4px 0 12px; }
  .jeju { font-size:13px; background:#fff8e6; border:1px solid #f3e2b3; border-radius:8px; padding:8px 12px; margin-bottom:16px; }
  ol.steps { list-style:none; padding:0; margin:0; counter-reset:s; }
  ol.steps li { position:relative; padding:0 0 18px 44px; counter-increment:s; }
  ol.steps li::before { content:counter(s); position:absolute; left:0; top:0; width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff; font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  ol.steps li:not(:last-child)::after { content:""; position:absolute; left:13px; top:30px; bottom:2px; width:2px; background:var(--line); }
  .st { font-weight:700; }
  .sd { color:var(--sub); font-size:14px; }
  .law { display:inline-block; font-size:12px; border:1px solid var(--line); border-radius:6px; padding:1px 7px; margin:4px 4px 0 0; color:var(--ink); text-decoration:none; }
  .law:hover { border-color:var(--accent); color:var(--accent); }
  .notes { font-size:13px; color:var(--sub); border-top:1px dashed var(--line); padding-top:10px; margin-top:4px; }
  mark { background:#fde68a; padding:0 1px; }
  details > summary { cursor:pointer; list-style:none; }
  details > summary::-webkit-details-marker { display:none; }
  .foot { color:var(--sub); font-size:12px; margin-top:28px; }
  @media (max-width:600px){ h1{font-size:26px;} .card{padding:20px;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">도시계획 실무지원</div>
  <h1>사업유형별 인허가 절차 안내</h1>
  <p class="lead">사업유형, 절차명, 법령 조문으로 검색할 수 있습니다.</p>

  <input id="q" class="search" type="search" placeholder="예: 관광농원, 사업계획 승인, 제106조, 준공" autocomplete="off">
  <div id="count" class="count"></div>
  <div id="list"></div>

  <p class="foot">기준일 <span id="updated"></span> · 근거 조문은 국가법령정보센터에서 최신 개정 여부를 확인하세요.</p>
</div>

<script src="data.js"></script>
<script>
  const $list = document.getElementById("list");
  const $q = document.getElementById("q");
  const $count = document.getElementById("count");
  document.getElementById("updated").textContent = UPDATED;

  const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const hl = (text, q) => {
    const t = esc(text);
    if (!q) return t;
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    return t.replace(re, m => `<mark>${m}</mark>`);
  };
  function haystack(p) {
    return [p.name, p.category, p.summary, ...(p.keywords||[]),
      ...p.steps.flatMap(s => [s.title, s.desc, ...(s.laws||[])])].join(" ").toLowerCase();
  }

  function render() {
    const q = $q.value.trim();
    const ql = q.toLowerCase();
    const hits = PERMITS.filter(p => !ql || haystack(p).includes(ql));
    $count.textContent = q ? `"${q}" 검색 결과 ${hits.length}건` : `전체 ${PERMITS.length}개 사업유형`;
    $list.innerHTML = hits.map(p => `
      <article class="card">
        <span class="tag">${esc(p.category)}</span>
        <h2>${hl(p.name, q)}</h2>
        <p class="summary">${hl(p.summary, q)}</p>
        ${p.jejuNote ? `<div class="jeju">제주 특례 · ${esc(p.jejuNote)}</div>` : ""}
        <ol class="steps">
          ${p.steps.map(s => `
            <li>
              <div class="st">${hl(s.title, q)}</div>
              <div class="sd">${hl(s.desc, q)}</div>
              ${(s.laws||[]).map(l => `<span class="law">${hl(l, q)}</span>`).join("")}
            </li>`).join("")}
        </ol>
        ${(p.notes||[]).length ? `<div class="notes">${p.notes.map(esc).join("<br>")}</div>` : ""}
      </article>`).join("") || `<div class="card">검색 결과가 없습니다.</div>`;
  }

  $q.addEventListener("input", render);
  // 주소 뒤에 ?q=관광농원 을 붙이면 검색된 상태로 열림 (노션 링크용)
  const init = new URLSearchParams(location.search).get("q");
  if (init) $q.value = init;
  render();
</script>
</body>
</html>
