<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 개발사업 인허가 검토 | 2026년 기준</title>
<style>@font-face { font-family:"KoPubDotum"; src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/KoPubDotumMedium.woff") format("woff"); font-weight:normal; font-display:swap; }</style>
<style>
  :root { --bg:#f3f6fa; --card:#fff; --ink:#1b2a41; --sub:#5b6b80; --line:#dfe5ee; --accent:#2563eb; --chip:#eef3fd; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"KoPubDotum","Malgun Gothic",system-ui,sans-serif; line-height:1.6; }
  .wrap { max-width:880px; margin:0 auto; padding:56px 16px 80px; }
  .eyebrow { color:var(--accent); font-size:14px; font-weight:600; }
  h1 { font-size:34px; margin:8px 0 8px; }
  .lead { color:var(--sub); margin:0 0 24px; }
  .home { text-align:center; padding-top:8vh; }
  .home h1 { font-size:30px; }
  .search { width:100%; padding:16px 18px; font-size:17px; border:1px solid var(--line); border-radius:14px; background:#fff; }
  .search:focus { outline:2px solid var(--accent); border-color:transparent; }
  .picks { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:18px; }
  .pick { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:8px 16px; font-size:15px; cursor:pointer; font-family:inherit; }
  .pick:hover { border-color:var(--accent); color:var(--accent); }
  .pick small { color:var(--sub); margin-left:6px; font-size:12px; }
  .msg { color:var(--sub); font-size:14px; margin-top:16px; }
  .back { display:inline-block; margin-bottom:20px; color:var(--accent); text-decoration:none; font-size:14px; cursor:pointer; background:none; border:none; padding:0; font-family:inherit; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px; }
  .card h2 { margin:0 0 4px; font-size:26px; }
  .tag { display:inline-block; font-size:12px; background:var(--chip); color:var(--accent); padding:2px 8px; border-radius:6px; margin-bottom:8px; }
  .summary { color:var(--sub); margin:4px 0 14px; }
  .jeju { font-size:13px; background:#fff8e6; border:1px solid #f3e2b3; border-radius:8px; padding:8px 12px; margin-bottom:20px; }
  ol.steps { list-style:none; padding:0; margin:0; counter-reset:s; }
  ol.steps li { position:relative; padding:0 0 20px 44px; counter-increment:s; }
  ol.steps li::before { content:counter(s); position:absolute; left:0; top:0; width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff; font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  ol.steps li:not(:last-child)::after { content:""; position:absolute; left:13px; top:30px; bottom:2px; width:2px; background:var(--line); }
  .st { font-weight:700; }
  .sd { color:var(--sub); font-size:14px; }
  .law { display:inline-block; font-size:12px; border:1px solid var(--line); border-radius:6px; padding:1px 7px; margin:4px 4px 0 0; }
  .notes { font-size:13px; color:var(--sub); border-top:1px dashed var(--line); padding-top:10px; margin-top:4px; }
  .foot { color:var(--sub); font-size:12px; margin-top:28px; text-align:center; }
  .wrap.wide { max-width:1180px; }
  .meta { display:flex; flex-wrap:wrap; gap:8px 20px; font-size:13px; color:var(--sub); margin:0 0 12px; }
  .meta b { color:var(--ink); }
  .check { border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:16px; font-size:14px; }
  .check .st { font-size:14px; }
  .tbl-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:12px; }
  table.sch { border-collapse:collapse; width:100%; min-width:860px; font-size:13px; table-layout:fixed; }
  .sch thead th:nth-child(1) { width:40px; } .sch thead th:nth-child(2) { width:100px; }
  .sch th, .sch td { border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:8px 10px; vertical-align:top; text-align:left; }
  .sch th:last-child, .sch td:last-child { border-right:none; }
  .sch thead th { background:#f7f9fc; font-weight:700; position:sticky; top:0; }
  .sch .ph { background:#f7f9fc; font-weight:700; writing-mode:vertical-rl; text-align:center; width:34px; letter-spacing:2px; }
  .sch .t { white-space:nowrap; font-weight:600; width:92px; }
  .sch td.on { background:var(--chip); color:var(--ink); }
  .sch td.on.dup { background:#eef3fd; } .sch td.on.dev { background:#ecf8f0; }
  .sch td.on.env { background:#fff6e5; } .sch td.on.etc { background:#f4effd; }
  .tlaws { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; margin:16px 0; }
  .tlaws > div { border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13px; }
  .q { font-weight:700; font-size:17px; margin:8px 0 10px; }
  .vpicks { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .vpick { border:1px solid var(--line); border-radius:12px; padding:8px 14px; text-decoration:none; color:var(--ink); background:#fff; display:flex; flex-direction:column; font-size:15px; }
  .vpick small { color:var(--sub); font-size:12px; }
  .vpick:hover, .vpick.sel { border-color:var(--accent); color:var(--accent); background:var(--chip); }
  .vhead { border-top:1px solid var(--line); padding-top:14px; margin-bottom:14px; }
  .tip { font-size:13px; background:#eef6ff; border:1px solid #cfe0fb; border-radius:8px; padding:8px 12px; margin-bottom:16px; }
  .toggles { display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; font-size:14px; margin-bottom:12px; }
  .toggles b { margin-right:4px; }
  .toggles label { cursor:pointer; }
  .sch .orig { font-size:11px; font-weight:400; color:var(--sub); }
  .calc { font-size:12px; color:#b45309; margin-left:6px; }
  .sch td.on.dis { background:#fdecec; } .sch td.on.land { background:#f4effd; } .sch td.on.trf { background:#eaf7f7; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .topbar .back { margin-bottom:0; }
  .pdf { border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:10px; padding:8px 16px; font-size:14px; cursor:pointer; font-family:inherit; }
  .pdf:hover { opacity:.9; }
  .printsel { display:none; }
  .printbar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:18px 0 6px; padding:14px 16px; border:1px solid #cfe0fb; background:#f5f9ff; border-radius:12px; }
  .printbar span { font-size:14px; color:var(--sub); }
  .printbar .pdf { font-size:15px; padding:10px 20px; }
  @page { size:A4 landscape; margin:10mm; }
  @media print { body { -webkit-print-color-adjust:exact; print-color-adjust:exact; } }
  body.printing { background:#fff; }
  body.printing .wrap, body.printing .wrap.wide { max-width:none; padding:0; margin:0; }
  body.printing .topbar, body.printing .printbar, body.printing .vpicks, body.printing .q, body.printing .toggles label { display:none !important; }
  body.printing .printsel { display:inline; }
  body.printing .card { border:none; padding:0; border-radius:0; }
  body.printing .tbl-wrap { overflow:visible; }
  body.printing table.sch { min-width:0; }
  body.printing .sch thead th { position:static; }
  body.printing .foot { margin:8px 0 0; text-align:left; }
  /* 첫 화면: 검토 전 확인할 사항 */
  .wrap.home2 { max-width:1180px; }
  .hero { margin-bottom:20px; }
  .hero h1 { font-size:30px; margin:6px 0 6px; }
  .hero .lead { margin:0; }
  .screen { background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin-bottom:14px; }
  .screen .ttl { font-weight:700; font-size:15px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .screen .ttl button { font:inherit; font-size:13px; color:var(--sub); background:none; border:1px solid var(--line); border-radius:8px; padding:4px 10px; cursor:pointer; }
  .fgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .fgrid label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--sub); }
  .fgrid select, .fgrid input { font:inherit; font-size:15px; color:var(--ink); padding:9px 10px; border:1px solid var(--line); border-radius:10px; background:#fff; width:100%; }
  .fgrid select:focus, .fgrid input:focus { outline:2px solid var(--accent); border-color:transparent; }
  .flags { display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:12px; font-size:14px; }
  .flags label { cursor:pointer; }
  .sumbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; font-size:14px; margin:4px 0 14px; min-height:24px; color:var(--sub); }
  .sumbar b { color:var(--ink); }
  .sumbar .go { display:inline-flex; gap:6px; flex-wrap:wrap; }
  .sumbar .go a { color:var(--accent); text-decoration:none; border:1px solid #cfe0fb; background:#f5f9ff; border-radius:999px; padding:3px 10px; font-size:13px; }
  .crit { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:12px; }
  .cr { background:#fff; border:1px solid var(--line); border-left:4px solid var(--line); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; }
  .cr.yes { border-left-color:#dc2626; } .cr.check { border-left-color:#d97706; } .cr.no { opacity:.72; }
  .cr-h { display:flex; align-items:center; gap:8px; }
  .cr-h h3 { margin:0; font-size:16px; flex:1; }
  .grp { font-size:11px; color:var(--accent); background:var(--chip); border-radius:6px; padding:1px 7px; white-space:nowrap; }
  .badge { font-size:12px; font-weight:700; border-radius:999px; padding:2px 10px; white-space:nowrap; }
  .badge.yes { background:#fdecec; color:#b91c1c; } .badge.check { background:#fff4e0; color:#b45309; } .badge.no { background:#eef1f5; color:var(--sub); }
  .cr ul { margin:0; padding:0; list-style:none; font-size:13.5px; }
  .cr li { padding:3px 0; border-top:1px dashed var(--line); }
  .cr li:first-child { border-top:none; }
  .cr li b { display:inline-block; min-width:64px; color:var(--ink); margin-right:4px; }
  .why { font-size:13.5px; border-radius:8px; padding:7px 10px; background:#f7f9fc; }
  .cr.yes .why { background:#fff5f5; } .cr.check .why { background:#fffaf0; }
  .after { font-size:12.5px; color:var(--sub); }
  .lawrow { font-size:12px; color:var(--sub); }
  .lawrow .law { margin-top:2px; }
  .rel { font-size:12.5px; } .rel a { color:var(--accent); text-decoration:none; margin-right:10px; }
  .procs { margin-top:36px; border-top:1px solid var(--line); padding-top:24px; }
  .procs h2 { font-size:20px; margin:0 0 4px; }
  .procs .search { max-width:560px; }
  .procs .picks { justify-content:flex-start; }
  .disclaim { font-size:12.5px; color:var(--sub); margin-top:10px; }

  .stepbox { margin-bottom:28px; }
  .sh { display:flex; align-items:center; gap:10px; margin:0 0 12px; }
  .sh h2 { margin:0; font-size:20px; }
  .num { width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; font-size:14px; }
  details.screen > summary { cursor:pointer; font-weight:700; font-size:14px; color:var(--accent); list-style:none; }
  details.screen > summary::before { content:"＋ "; } details.screen[open] > summary::before { content:"－ "; }
  details.screen[open] > summary { margin-bottom:12px; }
  .flags button { font:inherit; font-size:13px; color:var(--sub); background:none; border:1px solid var(--line); border-radius:8px; padding:2px 10px; cursor:pointer; margin-left:auto; }
  .crit { display:block; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .row { border-top:1px solid var(--line); border-left:4px solid transparent; }
  .row:first-child { border-top:none; }
  .row.yes { border-left-color:#dc2626; } .row.check { border-left-color:#d97706; } .row.no { opacity:.7; }
  .row > summary { list-style:none; cursor:pointer; display:grid; grid-template-columns:64px 210px 1fr 230px 76px; gap:10px; align-items:center; padding:11px 14px; font-size:14px; }
  .row > summary::-webkit-details-marker { display:none; }
  .row > summary:hover { background:#f7f9fc; }
  .row .grp { justify-self:start; }
  .rt { font-weight:700; }
  .rb { color:var(--ink); }
  .rl { color:var(--sub); font-size:12.5px; }
  .row .badge, .row .more { justify-self:end; }
  .more { font-size:12px; color:var(--accent); }
  .row[open] .more { color:var(--sub); }
  .rd { padding:4px 18px 16px 88px; display:flex; flex-direction:column; gap:8px; }
  .rd ul { margin:0; padding:0; list-style:none; font-size:13.5px; }
  .rd li { padding:3px 0; border-top:1px dashed var(--line); } .rd li:first-child { border-top:none; }
  .rd li b { display:inline-block; min-width:72px; margin-right:4px; }
  .row.yes .why { background:#fff5f5; } .row.check .why { background:#fffaf0; }
  .sumbar .hint { color:var(--sub); }
  .procs { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; margin-top:12px; border:none; padding:0; }
  .pc { display:flex; flex-direction:column; gap:4px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; text-decoration:none; color:var(--ink); }
  .pc:hover { border-color:var(--accent); }
  .pc.rec { border-color:#93b4f5; background:#f7faff; }
  .pc-h { display:flex; gap:6px; align-items:center; }
  .pc-cat { font-size:12px; color:var(--accent); }
  .pc-n { font-weight:700; font-size:16px; }
  .pc-p { font-size:13px; color:var(--sub); }
  .pc-go { font-size:13px; color:var(--accent); margin-top:4px; }
  .stepbox .search { max-width:none; }
  .basis { margin-top:22px; border-top:2px solid var(--ink); padding-top:14px; }
  .basis h3 { margin:0 0 6px; font-size:17px; }
  .bmain { margin:0 0 10px; font-size:14.5px; }
  .btbl { width:100%; border-collapse:collapse; font-size:13.5px; }
  .btbl th, .btbl td { border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; }
  .btbl th { background:#f7f9fc; }
  .btbl td:first-child { width:220px; font-weight:600; }
  .btbl td div + div { margin-top:3px; }
  .btbl tr.off td { color:var(--sub); }
  .offt { font-size:11.5px; font-weight:400; color:var(--sub); }
  .bnote { font-size:12px; color:var(--sub); margin:8px 0 0; }
  @media (max-width:860px){ .row > summary { grid-template-columns:auto 1fr auto; } .rb, .rl { grid-column:1 / -1; } .rd { padding-left:18px; } .btbl td:first-child { width:38%; } }
  @media (max-width:600px){ h1{font-size:24px;} .card{padding:20px;} .hero h1{font-size:24px;} .crit{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<p class="foot">기준일 <span id="updated"></span> · 근거 조문은 국가법령정보센터에서 최신 개정 여부를 확인하세요.</p>

<script src="data.js?v=20261104b"></script>
<script>
  const app = document.getElementById("app");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  if (typeof PERMITS === "undefined" || typeof CRITERIA === "undefined") {
    app.innerHTML = '<div class="card">최신 data.js를 불러오지 못했습니다. 저장소의 data.js가 2026-11-04 버전인지 확인한 뒤 Ctrl+F5로 새로고침하세요.</div>';
  } else {
    document.getElementById("updated").textContent = UPDATED;

    const find = q => {
      const k = q.trim().toLowerCase().replace(/\s/g, "");
      if (!k) return [];
      const norm = s => s.toLowerCase().replace(/\s/g, "");
      return PERMITS.filter(p => [p.name, ...(p.keywords||[])].some(w => norm(w).includes(k) || k.includes(norm(w))));
    };

    const ST = { type:"", zone:"", site:"", gfa:"", use:"", prot:false, mid:false, relic:false, open:false, q:"" };
    const pname = id => (PERMITS.find(p => p.id === id) || {}).name || id;
    const relLinks = ids => (ids||[]).filter(id => PERMITS.some(p => p.id === id)).map(id => `<a href="#${id}">${esc(pname(id))} →</a>`).join("");
    const opt = (list, v) => list.map(o => `<option value="${o.k}" ${o.k === v ? "selected" : ""}>${esc(o.n)}</option>`).join("");
    const period = p => p.schedule ? (p.schedule.total || "") : [...new Set((p.variants || []).map(v => v.tier).filter(t => t && /개월/.test(t)))].join(" / ") || `${(p.variants || []).length}가지 유형`;
    const L = { yes:"해당", check:"확인 필요", no:"해당 없음" };

    const evalAll = () => {
      const n = v => Math.max(0, Number(String(v).replace(/[^0-9.]/g, "")) || 0);
      const inp = { type:ST.type, Z:ZONES.find(z => z.k === ST.zone), site:n(ST.site), gfa:n(ST.gfa), use:ST.use, prot:ST.prot, mid:ST.mid, relic:ST.relic };
      const R = {};
      CRITERIA.forEach(c => { try { R[c.id] = c.test(inp, R); } catch (e) { R[c.id] = null; } });
      return R;
    };

    const drawCrit = () => {
      const R = evalAll();
      const any = CRITERIA.some(c => R[c.id]);
      const rank = { yes:0, check:1, no:2 };
      const list = any ? [...CRITERIA].sort((a, b) => (rank[R[a.id]?.s] ?? 3) - (rank[R[b.id]?.s] ?? 3)) : CRITERIA;
      document.getElementById("crit").innerHTML = list.map(c => {
        const r = R[c.id];
        return `<details class="row ${r ? r.s : ""}">
          <summary>
            <span class="grp">${esc(c.group)}</span>
            <span class="rt">${esc(c.title)}</span>
            <span class="rb">${esc(c.brief)}</span>
            <span class="rl">${esc(c.lawBrief)} 확인 후 진행</span>
            ${r ? `<span class="badge ${r.s}">${L[r.s]}</span>` : `<span class="more">상세</span>`}
          </summary>
          <div class="rd">
            ${r ? `<div class="why">${esc(r.why)}</div>` : ""}
            <ul>${c.rules.map(x => `<li><b>${esc(x[0])}</b>${esc(x[1])}</li>`).join("")}</ul>
            ${c.after ? `<div class="after">${esc(c.after)}</div>` : ""}
            <div class="lawrow">근거 · ${lawTags(c.laws)}</div>
            ${relLinks(c.go) ? `<div class="rel">관련 절차도 ${relLinks(c.go)}</div>` : ""}
          </div>
        </details>`;
      }).join("");
      const cnt = s => CRITERIA.filter(c => R[c.id]?.s === s).length;
      document.getElementById("sum").innerHTML = any
        ? `<b>해당 ${cnt("yes")}</b> · 확인 필요 ${cnt("check")} · 해당 없음 ${cnt("no")} <span class="hint">항목을 누르면 상세 기준과 판정 사유가 보입니다.</span>`
        : `<span class="hint">항목을 누르면 상세 기준·근거 조문·관련 절차도가 보입니다.</span>`;
      drawProcs();
    };

    const drawProcs = () => {
      const t = PTYPES.find(p => p.k === ST.type);
      const rec = new Set(t ? t.go : []);
      const q = ST.q.trim();
      let list = q ? find(q) : PERMITS;
      list = [...list].sort((a, b) => (rec.has(b.id) ? 1 : 0) - (rec.has(a.id) ? 1 : 0));
      document.getElementById("msg").textContent = q ? (list.length ? `${list.length}개 절차도` : "해당 사업유형이 아직 등록되지 않았습니다.") : "";
      document.getElementById("procs").innerHTML = list.map(p => `
        <a class="pc ${rec.has(p.id) ? "rec" : ""}" href="#${p.id}">
          <div class="pc-h">${rec.has(p.id) ? `<span class="badge yes">추천</span>` : ""}<span class="pc-cat">${esc(p.category)}</span></div>
          <div class="pc-n">${esc(p.name)}</div>
          <div class="pc-p">${esc(period(p))}</div>
          <div class="pc-go">절차도 보기 →</div>
        </a>`).join("");
    };

    const home = (q = "", msg = "") => {
      if (q) ST.q = q;
      app.classList.remove("wide");
      app.classList.add("home2");
      app.innerHTML = `
        <header class="hero">
          <div class="eyebrow">도시계획 실무지원 · 제주특별자치도</div>
          <h1>제주 개발사업 인허가 검토</h1>
        </header>
        <section class="stepbox">
          <div class="sh"><span class="num">1</span><h2>검토 전 확인사항</h2></div>
          <details class="screen" ${ST.open ? "open" : ""} id="scr">
            <summary>사업 규모를 입력해 해당 여부 보기</summary>
            <div class="fgrid">
              <label>사업 유형<select id="f-type"><option value="">선택</option>${opt(PTYPES, ST.type)}</select></label>
              <label>용도지역<select id="f-zone"><option value="">선택</option>${opt(ZONES, ST.zone)}</select></label>
              <label>부지(사업)면적 ㎡<input id="f-site" inputmode="numeric" placeholder="예: 30000" value="${esc(ST.site)}"></label>
              <label>건축 연면적 ㎡ (지하층 제외)<input id="f-gfa" inputmode="numeric" placeholder="예: 12000" value="${esc(ST.gfa)}"></label>
              <label>건축물 주용도 (교통 판정)<select id="f-use">${opt(BUSES, ST.use)}</select></label>
            </div>
            <div class="flags">
              <label><input type="checkbox" id="f-prot" ${ST.prot ? "checked" : ""}> 절대·상대보전지역 / 경관보전지구 1·2등급 포함</label>
              <label><input type="checkbox" id="f-mid" ${ST.mid ? "checked" : ""}> 중산간지역·해안선 50m 이내</label>
              <label><input type="checkbox" id="f-relic" ${ST.relic ? "checked" : ""}> 매장유산 유존지역 포함</label>
              <button type="button" id="reset">초기화</button>
            </div>
            <div class="disclaim">1차 스크리닝입니다. 실제 대상 여부는 근거 조문의 세부 요건과 담당부서 협의로 확정하세요.</div>
          </details>
          <div class="sumbar" id="sum"></div>
          <div class="crit" id="crit"></div>
        </section>
        <section class="stepbox">
          <div class="sh"><span class="num">2</span><h2>절차도 선택</h2></div>
          <input id="q" class="search" type="search" placeholder="사업유형 검색 (예: 유원지, 산업단지, 관광숙박, 정비구역)" autocomplete="off" value="${esc(ST.q)}">
          <div class="msg" id="msg">${msg}</div>
          <div class="procs" id="procs"></div>
        </section>`;
      const bind = (id, key, ev = "input") => {
        const el = document.getElementById(id);
        el.addEventListener(ev, () => { ST[key] = el.type === "checkbox" ? el.checked : el.value; drawCrit(); });
      };
      bind("f-type","type","change"); bind("f-zone","zone","change"); bind("f-use","use","change");
      bind("f-site","site"); bind("f-gfa","gfa");
      bind("f-prot","prot","change"); bind("f-mid","mid","change"); bind("f-relic","relic","change");
      document.getElementById("scr").addEventListener("toggle", e => { ST.open = e.target.open; });
      document.getElementById("reset").onclick = () => { Object.assign(ST, { type:"", zone:"", site:"", gfa:"", use:"", prot:false, mid:false, relic:false }); home(); };
      const $q = document.getElementById("q");
      $q.addEventListener("input", () => { ST.q = $q.value; drawProcs(); });
      $q.addEventListener("keydown", e => {
        if (e.key !== "Enter") return;
        const hits = find($q.value);
        if (hits.length) location.hash = hits[0].id;
      });
      drawCrit();
    };

    const lawTags = laws => (laws||[]).map(l => `<span class="law">${esc(l)}</span>`).join("");

    const parseT = t => {
      if (/^D$/.test(t.trim())) return { a: 0, b: 0 };
      const m = t.match(/D\s*\+\s*(\d+)(?:\s*~\s*(\d+))?/);
      return m ? { a: +m[1], b: +(m[2] || m[1]) } : null;
    };
    const fmtT = (a, b) => a === 0 && b === 0 ? "D" : (a === b ? `D+${a}개월` : `D+${a}~${b}개월`);

    const scheduleView = (s, on) => {
      const tracks = s.tracks.filter(t => on[t.id] !== false);
      const shown = r => tracks.some(t => r.c[t.id]);
      const flat = s.phases.flatMap(ph => ph.rows);
      const pos = flat.map(r => parseT(r.t));
      const dur = flat.map((r, i) => {
        if (!pos[i]) return 0;
        for (let k = i + 1; k < flat.length; k++) if (pos[k]) return pos[k].a - pos[i].a;
        return 0;
      });
      let shift = 0, lastEnd = 0;
      const label = new Map();
      flat.forEach((r, i) => {
        if (!shown(r)) { shift += dur[i]; return; }
        if (!pos[i]) { label.set(r, { t: r.t }); return; }
        const a = pos[i].a - shift, b = pos[i].b - shift;
        lastEnd = Math.max(lastEnd, b);
        label.set(r, { t: fmtT(a, b), orig: shift ? r.t : "" });
      });
      const head = `<tr><th>단계</th><th>개략 기간</th>${tracks.map(t => `<th>${esc(t.name)}</th>`).join("")}</tr>`;
      const body = s.phases.map(ph => {
        const rows = ph.rows.filter(shown);
        return rows.map((r, i) => {
          const L = label.get(r);
          return `
        <tr>
          ${i === 0 ? `<td class="ph" rowspan="${rows.length}">${esc(ph.name)}</td>` : ""}
          <td class="t">${esc(L.t)}${L.orig ? `<div class="orig">원래 ${esc(L.orig)}</div>` : ""}</td>
          ${tracks.map(t => r.c[t.id] ? `<td class="on ${t.id}">${esc(r.c[t.id])}</td>` : "<td></td>").join("")}
        </tr>`;
        }).join("");
      }).join("");
      const opts = s.tracks.filter(t => t.optional);
      const total = shift > 0
        ? `약 ${lastEnd}개월 <span class="calc">제외한 절차 기간을 빼고 자동 계산 · 원래 ${esc(s.total || "")}</span>`
        : esc(s.total || "");
      return `
        ${opts.length ? `<div class="toggles"><b>해당 영향평가</b><span class="printsel">${esc(opts.filter(t => on[t.id] !== false).map(t => t.name).join(", ") || "해당 없음")}</span>${opts.map(t => `<label><input type="checkbox" data-t="${t.id}" ${on[t.id] !== false ? "checked" : ""}> ${esc(t.name)}</label>`).join("")}</div>` : ""}
        <div class="meta"><span><b>기준</b> ${esc(s.base)}</span>${s.total ? `<span><b>총 소요</b> ${total}</span>` : ""}</div>
        <div class="tbl-wrap"><table class="sch"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
    };


    const LAWS = [
      ["제주 개발사업시행 승인 조례", "「제주특별자치도 개발사업시행 승인 등에 관한 조례」"],
      ["개발사업시행 승인 조례", "「제주특별자치도 개발사업시행 승인 등에 관한 조례」"],
      ["제주 환경영향평가 조례", "「제주특별자치도 환경영향평가 조례」"],
      ["제주 도시교통정비 촉진 조례", "「제주특별자치도 도시교통정비 촉진에 관한 조례」"],
      ["제주 건축계획심의 조례", "「제주특별자치도 건축계획심의에 관한 조례」"],
      ["제주 도시계획 조례", "「제주특별자치도 도시계획 조례」"],
      ["제주 경관 조례", "「제주특별자치도 경관 조례」"],
      ["제주특별법", "「제주특별자치도 설치 및 국제자유도시 조성을 위한 특별법」"],
      ["국토계획법", "「국토의 계획 및 이용에 관한 법률」"],
      ["산업입지법", "「산업입지 및 개발에 관한 법률」"],
      ["산단특례법", "「산업단지 인·허가 절차 간소화를 위한 특례법」"],
      ["도시정비법", "「도시 및 주거환경정비법」"],
      ["도시교통정비 촉진법", "「도시교통정비 촉진법」"],
      ["환경영향평가법", "「환경영향평가법」"],
      ["자연재해대책법", "「자연재해대책법」"],
      ["국가유산영향진단법", "「국가유산영향진단법」"],
      ["농어촌정비법", "「농어촌정비법」"],
      ["관광진흥법", "「관광진흥법」"],
      ["주택법", "「주택법」"],
      ["경관법", "「경관법」"],
      ["건축법", "「건축법」"]
    ];
    const LAW_RE = new RegExp(LAWS.map(x => x[0].replace(/\s/g, "\\s")).join("|"), "g");
    const fullLaw = t => esc(t).replace(LAW_RE, m => LAWS.find(x => x[0] === m)[1]);
    const basisView = (P, x, on) => {
      const mains = (P.category || "").split("·").map(t => t.trim()).filter(Boolean);
      let rows = [];
      if (x.schedule) rows = x.schedule.tracks.map(t => ({ k: t.name, laws: t.laws || [], off: on[t.id] === false }));
      else rows = (x.steps || []).filter(s => (s.laws || []).length).map(s => ({ k: s.title, laws: s.laws }));
      if (!rows.length && !mains.length) return "";
      return `
        <section class="basis">
          <h3>법적 근거</h3>
          <p class="bmain">이 절차는 ${mains.map(fullLaw).join(", ")}에 따라 진행합니다.</p>
          ${rows.length ? `<table class="btbl"><thead><tr><th>${x.schedule ? "절차 구분" : "절차 단계"}</th><th>근거 법령</th></tr></thead><tbody>
            ${rows.map(r => `<tr class="${r.off ? "off" : ""}"><td>${esc(r.k)}${r.off ? `<div class="offt">이번 일정에서 제외</div>` : ""}</td><td>${r.laws.map(l => `<div>${fullLaw(l)}</div>`).join("")}</td></tr>`).join("")}
          </tbody></table>` : ""}
          <p class="bnote">'(조문 미확인)' 표시는 근거 조문을 확인하지 못한 항목입니다. 적용 전 국가법령정보센터에서 현행 조문을 확인하세요.</p>
        </section>`;
    };

    const stepsView = steps => `
      <ol class="steps">
        ${(steps||[]).map(s => `
          <li>
            <div class="st">${esc(s.title)}</div>
            ${s.desc ? `<div class="sd">${esc(s.desc)}</div>` : ""}
            ${lawTags(s.laws)}
          </li>`).join("")}
      </ol>`;

    const mountBody = (el, x, P) => {
      const on = {};
      if (x.schedule) x.schedule.tracks.forEach(t => { if (t.off) on[t.id] = false; });
      const draw = () => {
        el.innerHTML = `${(x.checks||[]).map(c => `<div class="check"><div class="st">확인 · ${esc(c.title)}</div><div class="sd">${esc(c.desc)}</div>${lawTags(c.laws)}</div>`).join("")}${x.tip ? `<div class="tip">${esc(x.tip)}</div>` : ""}${x.schedule ? scheduleView(x.schedule, on) : ""}${stepsView(x.steps)}${basisView(P, x, on)}
          <div class="printbar"><span>선택한 절차와 영향평가 기준으로 A4 가로 한 장에 출력합니다.</span><button class="pdf" data-print>선택한 절차 PDF로 출력</button></div>`;
        el.querySelectorAll("input[data-t]").forEach(cb => cb.onchange = () => { on[cb.dataset.t] = cb.checked; draw(); });
      };
      draw();
    };

    const detail = (p, vid) => {
      const v = p.variants ? p.variants.find(x => x.id === vid) : null;
      const wide = !!(p.schedule || (v && v.schedule));
      app.classList.remove("home2");
      app.classList.toggle("wide", wide);
      app.innerHTML = `
        <div class="topbar">
          <button class="back" id="back">← 다른 사업 검토하기</button>
          <button class="pdf" id="pdf" title="인쇄 창에서 대상을 'PDF로 저장'으로 선택하세요">PDF로 출력</button>
        </div>
        <article class="card">
          <span class="tag">${esc(p.category)}</span>
          <h2>${esc(p.name)}</h2>
          <p class="summary">${esc(p.summary)}</p>
          ${p.jejuNote ? `<div class="jeju">제주 특례 · ${esc(p.jejuNote)}</div>` : ""}
          ${(p.checks||[]).map(c => `<div class="check"><div class="st">사전 확인 · ${esc(c.title)}</div><div class="sd">${esc(c.desc)}</div>${lawTags(c.laws)}</div>`).join("")}
          ${p.variants ? `
            <div class="q">${esc(p.question || "어떤 경우인가요?")}</div>
            <div class="vpicks">${p.variants.map(x => `<a class="vpick ${v && v.id === x.id ? "sel" : ""}" href="#${p.id}/${x.id}">${esc(x.label)}<small>${esc(x.tier)}</small></a>`).join("")}</div>
            ${v ? `<div class="vhead"><span class="tag">${esc(v.tier)}</span> <b>${esc(v.label)}</b><div class="sd">${esc(v.summary || "")}</div></div>` : ""}` : ""}
          <div id="body"></div>
          ${(p.notes||[]).length ? `<div class="notes">${p.notes.map(esc).join("<br>")}</div>` : ""}
        </article>`;
      if (v) mountBody(document.getElementById("body"), v, p);
      else if (!p.variants) mountBody(document.getElementById("body"), { ...p, checks: null }, p);
      document.getElementById("back").onclick = () => { location.hash = ""; };
      const doPrint = () => {
        const old = document.title;
        document.title = `${p.name}${v ? "_" + v.label : ""}_인허가절차`.replace(/[\\/:*?"<>|]/g, "");
        window.print();
        document.title = old;
      };
      document.getElementById("pdf").onclick = doPrint;
      app.onclick = e => { if (e.target.closest("[data-print]")) doPrint(); };
      if (!vid) window.scrollTo(0, 0);
    };

    const PAGE_W = 277 * 96 / 25.4, PAGE_H = 190 * 96 / 25.4 * 0.93;
    const fitPage = () => {
      const b = document.body;
      b.classList.add("printing");
      b.style.zoom = 1;
      const fits = z => {
        b.style.width = (PAGE_W / z) + "px";
        return document.documentElement.scrollHeight * z <= PAGE_H;
      };
      let z = 1;
      if (!fits(1)) {
        let lo = 0.15, hi = 1;
        for (let i = 0; i < 14; i++) { const m = (lo + hi) / 2; if (fits(m)) lo = m; else hi = m; }
        z = lo;
        fits(z);
      }
      b.style.zoom = z;
    };
    const unfit = () => {
      const b = document.body;
      b.classList.remove("printing");
      b.style.zoom = ""; b.style.width = "";
    };
    window.addEventListener("beforeprint", fitPage);
    window.addEventListener("afterprint", unfit);

    const route = () => {
      const [id, vid] = decodeURIComponent(location.hash.slice(1)).split("/");
      const p = PERMITS.find(x => x.id === id);
      if (p) return detail(p, vid);
      const q = new URLSearchParams(location.search).get("q") || "";
      if (q) { const hits = find(q); if (hits.length === 1) { location.hash = hits[0].id; return; } }
      home(q);
      if (q) document.getElementById("q").dispatchEvent(new Event("input"));
    };
    window.addEventListener("hashchange", route);
    route();
  }
</script>
</body>
</html>
